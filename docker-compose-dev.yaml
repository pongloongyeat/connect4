services:
  postgres:
    image: postgres:18.4
    container_name: connect4_db
    environment:
      POSTGRES_DB: connect4
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d connect4 -U username"]
      interval: 10s
      timeout: 5s
      retries: 5

